[package]
name = "fractal-interference"
version = "0.1.0"
edition = "2021"
description = "A WebAssembly-powered fractal interference visualization using Rust and React.js"
readme = "README.md"
license = "Unlicense"
keywords = ["fractal", "wasm", "webassembly", "interference", "visualization"]
categories = ["visualization", "wasm", "graphics"]
repository = "https://github.com/konard/fractal-interference"
documentation = "https://github.com/konard/fractal-interference"
rust-version = "1.70"

[lib]
name = "fractal_interference"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fractal-interference"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"], optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
]

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
wasm-bindgen-test = "0.3"

[features]
default = []
cli = ["tokio"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
